[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-intelligence-station"
version = "0.1.0"
description = "Durable private-LAN station bridge for the Radxa Cubie A7A"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<0.129", "httpx>=0.27,<0.29", "pydantic>=2.9,<3", "python-multipart>=0.0.20,<0.0.23", "uvicorn>=0.30,<0.40", "websockets>=15,<16"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
meeting-station = "meeting_station.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
