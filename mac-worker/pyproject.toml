[project]
name = "meeting-intelligence-worker"
version = "0.1.0"
description = "Offline macOS inference worker for AI Meeting Intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pypdf>=5,<7"]
local = ["sherpa-onnx>=1.12,<2", "numpy>=1.24,<3"]
mlx = ["mlx-whisper>=0.4"]
gigaam = ["torch>=2.6", "torchaudio>=2.6", "transformers>=4.48"]
diarization = ["pyannote.audio>=3.3,<4"]

[project.scripts]
meeting-worker = "meeting_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
